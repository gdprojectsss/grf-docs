<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="1" r="0.8">
      <stop offset="0" stop-color="#dc2626" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#121110"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="80" y="86" width="132" height="132" rx="30" fill="url(#badge)"/>
  <text x="146" y="172" text-anchor="middle" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="60" font-weight="700" fill="#ffffff">&gt;_</text>
  <text x="246" y="190" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="104" font-weight="700" letter-spacing="-3" fill="#f1ede9">grfsh</text>
  <rect x="582" y="110" width="14" height="88" rx="3" fill="#f97316"/>
  <text x="80" y="300" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="46" font-weight="600" fill="#f1ede9">A small Unix shell written in Rust.</text>
  <text x="80" y="362" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" fill="#b5ada6">Bash style scripting, typed table pipelines,</text>
  <text x="80" y="404" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" fill="#b5ada6">and an agent mode for coding agents.</text>
  <rect x="80" y="466" width="620" height="76" rx="14" fill="#0d0c0b" stroke="#f97316" stroke-opacity="0.7" stroke-width="2"/>
  <text x="108" y="515" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="28" fill="#fb923c">$</text>
  <text x="138" y="515" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="28" fill="#e6edf3">curl -fsSL https://grf.sh | sh</text>
  <text x="1120" y="515" text-anchor="end" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="30" font-weight="700" fill="#fdba74">grf.sh</text>
</svg>
